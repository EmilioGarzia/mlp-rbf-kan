[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlp_rbf_kan"
version = "0.1.0"
description = "MLP with RBF-KAN as activation function and some experiment that compare this model with others"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Emilio Garzia" }
]
requires-python = ">=3.8"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]